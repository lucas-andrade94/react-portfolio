<!DOCTYPE html>

    <meta charset="utf-8" />

    />
    <script>
      // Apply the theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem("theme");
        if (t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches))
          document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
